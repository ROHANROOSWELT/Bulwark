<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldBorder" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="shieldCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Shield Aura -->
  <polygon points="50,6 88,24 88,60 50,94 12,60 12,24" 
           stroke="url(#shieldBorder)" stroke-width="4" stroke-linejoin="round"
           fill="url(#shieldCore)" filter="url(#neonGlow)" />

  <!-- Inner Bevel Shield -->
  <polygon points="50,14 80,29 80,56 50,84 20,56 20,29" 
           stroke="#059669" stroke-width="2" stroke-linejoin="round"
           fill="#022c22" />

  <!-- Circuit Trace Lines -->
  <path d="M 32 36 L 42 36 L 46 44 L 46 54" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <circle cx="32" cy="36" r="2" fill="#10b981" />

  <path d="M 68 36 L 58 36 L 54 44 L 54 54" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <circle cx="68" cy="36" r="2" fill="#059669" />

  <path d="M 50 20 L 50 32" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <circle cx="50" cy="20" r="2.5" fill="#10b981" />

  <!-- Center 'B' Emblem for BULWARK -->
  <path d="M 40 34 L 52 34 C 57 34 60 37 60 41 C 60 44 58 46 54 47 C 59 48 62 51 62 56 C 62 61 58 64 52 64 L 40 64 Z" 
        stroke="url(#cyanGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGlow)" />

  <path d="M 40 48 L 51 48" stroke="url(#cyanGlow)" stroke-width="2.5" stroke-linecap="round" />
</svg>
